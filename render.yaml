services:
  - type: web
    name: aegis-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install --no-cache-dir torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_PROVIDER
        value: mock
      - key: MODEL_NAME
        value: mock-default
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.4
      # Set these manually in the Render dashboard once you have a live provider key —
      # left blank here so nothing sensitive is ever committed to the repo.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
